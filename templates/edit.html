<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <!-- ضبط الصفحة لتناسب شاشة الهاتف -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>تعديل بيانات الطالب</title>

    <!-- ربط ملف CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


    <!-- ==========================================
         عنوان الصفحة
         ========================================== -->

    <h1>
        تعديل بيانات الطالب
    </h1>


    <!-- ==========================================
         عرض رسالة الخطأ
         ========================================== -->

    {% if error %}

        <!--
            إذا حدث خطأ في البيانات،
            يعرض Flask الرسالة هنا
        -->

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <!-- ==========================================
         نموذج تعديل الطالب
         ========================================== -->

    <form
        action="/update/{{ student[0] }}"
        method="POST"
    >


        <!-- ==========================================
             اسم الطالب
             ========================================== -->

        <label>
            اسم الطالب
        </label>

        <input
            type="text"
            name="name"
            value="{{ student[1] }}"
        >


        <!-- ==========================================
             عمر الطالب
             ========================================== -->

        <label>
            العمر
        </label>

        <input
            type="text"
            name="age"
            value="{{ student[2] }}"
        >


        <!-- ==========================================
             البريد الإلكتروني
             ========================================== -->

        <label>
            البريد الإلكتروني
        </label>

        <input
            type="email"
            name="email"
            value="{{ student[3] }}"
        >


        <!-- ==========================================
             المادة
             ========================================== -->

        <label>
            المادة
        </label>

        <select name="mada">

            <option value="">
                اختر المادة
            </option>

            <option
                value="رياضيات"
                {% if student[4] == "رياضيات" %}selected{% endif %}
            >
                رياضيات
            </option>

            <option
                value="برمجة"
                {% if student[4] == "برمجة" %}selected{% endif %}
            >
                برمجة
            </option>

            <option
                value="حاسب آلي"
                {% if student[4] == "حاسب آلي" %}selected{% endif %}
            >
                حاسب آلي
            </option>

            <option
                value="علوم"
                {% if student[4] == "علوم" %}selected{% endif %}
            >
                علوم
            </option>

        </select>


        <!-- ==========================================
             زر حفظ التعديل
             ========================================== -->

        <button type="submit">
            حفظ التعديل
        </button>

    </form>


    <!-- ==========================================
         العودة إلى قائمة الطلاب
         ========================================== -->

    <br>

    <div style="text-align: center;">

        <a href="/students">
            العودة إلى قائمة الطلاب
        </a>

    </div>


</body>

</html>
