<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <!-- يجعل الصفحة تتناسب مع عرض الهاتف -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إضافة طالب</title>

    <!-- ربط ملف CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <!-- ==========================================
         عنوان الصفحة
         ========================================== -->

    <h1>
        إضافة طالب جديد
    </h1>


    <!-- ==========================================
         عرض رسالة الخطأ
         ========================================== -->

    {% if error %}

        <!--
            إذا أرسل app.py متغيرًا اسمه error
            فسوف تظهر رسالة الخطأ هنا
        -->

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <!-- ==========================================
         نموذج إضافة الطالب
         ========================================== -->

    <form action="/submit" method="POST">


        <!-- ==========================================
             حقل اسم الطالب
             ========================================== -->

        <label>
            اسم الطالب
        </label>

        <input
            type="text"
            name="name"
            value="{{ name or '' }}"
            placeholder="أدخل اسم الطالب"
        >


        <!-- ==========================================
             حقل العمر
             ========================================== -->

        <label>
            العمر
        </label>

        <input
            type="text"
            name="age"
            value="{{ age or '' }}"
            placeholder="أدخل العمر"
        >


        <!-- ==========================================
             حقل البريد الإلكتروني
             ========================================== -->

        <label>
            البريد الإلكتروني
        </label>

        <input
            type="email"
            name="email"
            value="{{ email or '' }}"
            placeholder="أدخل البريد الإلكتروني"
        >


        <!-- ==========================================
             اختيار المادة
             ========================================== -->

        <label>
            المادة
        </label>

        <select name="mada">

            <option value="">
                اختر المادة
            </option>

            <option value="رياضيات">
                رياضيات
            </option>

            <option value="برمجة">
                برمجة
            </option>

            <option value="حاسب آلي">
                حاسب آلي
            </option>

            <option value="علوم">
                علوم
            </option>

        </select>


        <!-- ==========================================
             زر إرسال البيانات
             ========================================== -->

        <button type="submit">
            إضافة الطالب
        </button>

    </form>


    <!-- ==========================================
         العودة إلى صفحة الطلاب
         ========================================== -->

    <br>

    <div style="text-align: center;">

        <a href="/students">
            العودة إلى قائمة الطلاب
        </a>

    </div>


</body>

</html>
